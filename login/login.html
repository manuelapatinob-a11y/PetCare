<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetCare | Iniciar Sesión</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="login.css">
</head>

<body>

<div class="container">

    <div class="row justify-content-center align-items-center min-vh-100"
        <div class="col-lg-10">

            <div class="card login-card">

                <div class="row g-0">

                    <!-- LADO IZQUIERDO -->
                    <div class="col-md-6 imagen-login">

                        <div class="contenido-imagen">

                            <img src="logo.png" class="logo-login">

                            <img src=""
                                class="img-fluid mascota">

                        </div>

                    </div>

                    <!-- LADO DERECHO -->

                    <div class="col-md-6">
                        
                        <div class="formulario">

                            <h3>Iniciar Sesión</h3>

                            <p class="text-muted mb-4">
                                Ingresa con tu cuenta.
                            </p>

                            <form>

                                <div class="mb-3">

                                    <label>Correo electrónico</label>

                                    <input
                                        type="email"
                                        class="form-control"
                                        placeholder="ejemplo@gmail.com">

                                </div>

                                <div class="mb-3">

                                    <label>Contraseña</label>

                                    <input
                                        type="password"
                                        class="form-control"
                                        placeholder="********">

                                </div>

                                <div class="d-flex justify-content-between mb-4">

                                    <div>

                                        <input type="checkbox">

                                        Recordarme

                                    </div>

                                    <a href="recuperar.html" class="text-decoration-none">
                                        ¿Olvidaste tu contraseña?
                                    </a>

                                </div>

                                <button type="submit"class="btn btn-login w-100">
                                    Iniciar Sesión
                                </button>
                            </form>

                            <hr>

                            <div class="text-center">

                                ¿No tienes cuenta?

                            <a href="registro.html"class="btn btn-outline-primary rounded-pill">
                                Regístrate
                            </a>
                            </div>

                            <div class="text-center mt-4">

                            <button type="button"class="btn btn-google">
                                <i class="bi bi-google"></i>
                                Continuar con Google
                            </button>
                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
